# Déploiement automatique : à chaque push sur main, publie l'app statique
# sur la branche gh-pages (source GitHub Pages configurée sur cette branche).
# Ne publie que index.html + css/ + js/ (pas tests/ ni supabase.sql).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparer le site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js _site/
          touch _site/.nojekyll

      - name: Publier sur gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy from $GITHUB_SHA"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
